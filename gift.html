<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 3amory 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #F7F3ED;
      --card-bg: #FFFFFF;
      --burgundy: #7A1C29;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 15px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-sparkle {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(circle, #7A1C29 2px, transparent 2px),
        radial-gradient(circle, #FFD700 2px, transparent 2px);
      background-size: 60px 60px;
      opacity: 0.2;
    }

    .story-section {
      width: 100%;
      max-width: 400px;
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 15px;
      z-index: 2;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 10px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(122, 28, 41, 0.08);
      text-align: center;
      border: 1.5px solid #EAE3D9;
      position: relative;
    }

    .story-img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 14px;
      background-color: #FAF8F5;
      display: block;
    }

    .envelope-box {
      background: #FAF8F5;
      border: 2px dashed var(--burgundy);
      border-radius: 16px;
      padding: 25px 15px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      margin: 5px 0;
    }

    .envelope-box:hover {
      background: #F4EBE8;
    }

    .envelope-heart {
      font-size: 3rem;
      color: var(--burgundy);
      animation: pulseHeart 1.5s infinite;
      margin-bottom: 8px;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .envelope-text {
      color: var(--burgundy);
      font-size: 1.1rem;
      font-weight: bold;
      font-family: 'Amiri', serif;
    }

    .hidden-video-container {
      display: none;
      margin-top: 5px;
    }

    .story-video {
      width: 100%;
      max-height: 380px;
      border-radius: 12px;
      background-color: #000;
      outline: none;
    }

    .exact-custom-text {
      margin-top: 10px;
      color: var(--burgundy);
      font-size: 1.05rem;
      font-weight: bold;
      font-family: 'Amiri', serif;
      line-height: 1.8;
      white-space: pre-line;
    }

    .floating-arrow-guide {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 15px;
      font-size: 1.3rem;
      color: #FFFFFF;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--burgundy), #5A121D);
      box-shadow: 0 0 12px rgba(122, 28, 41, 0.7);
      border: 2px solid #F9ECEE;
      cursor: pointer;
      z-index: 1000;
      animation: floatButterfly 2s infinite ease-in-out;
      transition: opacity 0.3s ease;
    }

    @keyframes floatButterfly {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(6px); }
    }

    .star {
      position: absolute;
      width: 14px;
      height: 14px;
      background: gold;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: fall linear forwards;
      z-index: 999;
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(500px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-sparkle"></div>
  <audio id="bg-music" src="MUSIC.mp3" preload="auto" loop></audio>

  <div id="flying-arrow" class="floating-arrow-guide" onclick="scrollToNext()">⬇</div>

  <!-- الصفحة الأولى -->
  <div class="story-section" id="section-1">
    <div class="container">
      <img id="img-1" alt="Photo 1" class="story-img">
    </div>
  </div>

  <!-- الصفحة الثانية -->
  <div class="story-section" id="section-2">
    <div class="container">
      <img id="img-2" alt="Photo 2" class="story-img">
    </div>
  </div>

  <!-- الصفحة الثالثة (ظرف الفيديو والنص الخاص بكي) -->
  <div class="story-section" id="section-3">
    <div class="container">
      <div id="envelope" class="envelope-box" onclick="openEnvelope()">
        <div class="envelope-heart">💌</div>
        <div class="envelope-text">دوس ع القلب فقط</div>
      </div>

      <div id="video-container" class="hidden-video-container">
        <video id="story-video" class="story-video" controls playsinline preload="metadata">
          <source src="3.mp4" type="video/mp4">
          متصفحك لا يدعم عرض الفيديو
        </video>
        <div class="exact-custom-text">من السنة اللي فاتت للنهارده 
كل لحظة معاك كانت من اجمل ايام حياتي 
ربنا يخليك ليا ياحبيبي ونفضل العمر كله سوا ...</div>
      </div>
    </div>
  </div>

  <!-- الصفحة الرابعة والأخيرة -->
  <div class="story-section" id="section-4">
    <div class="container">
      <img id="img-4" alt="Photo 4" class="story-img">
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSections = 4;

    window.onload = function() {
      const music = document.getElementById('bg-music');
      const video = document.getElementById('story-video');

      function playMusicOnce() {
        music.play().catch(e => console.log("Audio waiting"));
        document.removeEventListener('click', playMusicOnce);
        document.removeEventListener('touchstart', playMusicOnce);
      }
      document.addEventListener('click', playMusicOnce);
      document.addEventListener('touchstart', playMusicOnce);

      if(video) {
        video.onplay = () => { if(!music.paused) music.volume = 0.1; };
        video.onpause = () => { music.volume = 1.0; };
        video.onended = () => { music.volume = 1.0; };
      }

      loadSmartImage('img-1', ['Photo1', 'photo1', 'Photo 1', 'photo 1', '1']);
      loadSmartImage('img-2', ['Photo2', 'photo2', 'Photo 2', 'photo 2', '2']);
      loadSmartImage('img-4', ['Photo4', 'photo4', 'Photo 4', 'photo 4', '4']);
    };

    function openEnvelope() {
      const envelope = document.getElementById('envelope');
      const videoContainer = document.getElementById('video-container');
      const video = document.getElementById('story-video');
      const music = document.getElementById('bg-music');

      envelope.style.display = 'none';
      videoContainer.style.display = 'block';

      if(!music.paused) music.volume = 0.1;
      video.play().catch(e => console.log("Video autoplay blocked"));
    }

    function scrollToNext() {
      const music = document.getElementById('bg-music');
      if (music.paused) {
        music.play().catch(e => {});
      }

      currentStep++;
      if (currentStep > totalSections) {
        currentStep = totalSections;
        return;
      }

      const target = document.getElementById('section-' + currentStep);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      if (currentStep === totalSections) {
        setTimeout(() => {
          const arrow = document.getElementById('flying-arrow');
          arrow.style.opacity = '0';
          arrow.style.pointerEvents = 'none';
          triggerFinalCelebration();
        }, 500);
      }
    }

    function triggerFinalCelebration() {
      createFallingStars();
      confetti({
        particleCount: 200,
        spread: 160,
        origin: { y: 0.6 },
        colors: ['#7A1C29', '#FFD700', '#FFFFFF', '#FF69B4', '#FF4500']
      });
    }

    function createFallingStars() {
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = Math.random() * window.innerWidth + 'px';
          star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
          document.body.appendChild(star);
          setTimeout(() => star.remove(), 4000);
        }, i * 80);
      }
    }

    function loadSmartImage(imgId, namesList) {
      const imgElem = document.getElementById(imgId);
      if(!imgElem) return;
      const exts = ['jpg', 'JPG', 'png', 'PNG', 'jpeg', 'JPEG'];
      let nIdx = 0;
      function tryNextName() {
        if (nIdx >= namesList.length) return;
        let base = namesList[nIdx];
        let eIdx = 0;
        function tryNextExt() {
          if (eIdx >= exts.length) { nIdx++; tryNextName(); return; }
          let src = base + '.' + exts[eIdx++];
          let testImg = new Image();
          testImg.onload = () => imgElem.src = src;
          testImg.onerror = () => tryNextExt();
          testImg.src = src;
        }
        tryNextExt();
      }
      tryNextName();
    }
  </script>
</body>
</html>
