<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 3amory</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #F7F3ED;
      --card-bg: #FFFFFF;
      --burgundy: #7A1C29;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    .story-section {
      width: 100%;
      max-width: 400px;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 12px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(122, 28, 41, 0.08);
      text-align: center;
      border: 1.5px solid #EAE3D9;
    }

    .story-img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 14px;
      background-color: #FAF8F5;
      display: block;
    }

    .video-box {
      background: #FAF8F5;
      border: 2px solid var(--burgundy);
      border-radius: 16px;
      padding: 15px;
      text-align: center;
    }

    .story-video {
      width: 100%;
      max-height: 350px;
      border-radius: 12px;
      background-color: #000;
    }

    .exact-custom-text {
      margin-top: 12px;
      color: var(--burgundy);
      font-size: 1.05rem;
      font-weight: bold;
      font-family: 'Amiri', serif;
      line-height: 1.8;
      white-space: pre-line;
    }

    .next-btn {
      margin-top: 15px;
      background-color: var(--burgundy);
      color: white;
      border: none;
      padding: 10px 25px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(122, 28, 41, 0.3);
    }

    .celebrate-btn {
      margin-top: 15px;
      background: linear-gradient(135deg, #7A1C29, #FFD700);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
    }

    .star {
      position: fixed;
      width: 16px;
      height: 16px;
      background: #FFD700;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: fall linear forwards;
      z-index: 9999;
    }

    @keyframes fall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="MUSIC.mp3" preload="auto" loop></audio>

  <!-- الصفحة الأولى -->
  <div class="story-section" id="sec-1">
    <div class="container">
      <img id="img-1" class="story-img" alt="1">
      <button class="next-btn" onclick="goToSec(2)">التالي ✨</button>
    </div>
  </div>

  <!-- الصفحة الثانية -->
  <div class="story-section" id="sec-2" style="display:none;">
    <div class="container">
      <img id="img-2" class="story-img" alt="2">
      <button class="next-btn" onclick="goToSec(3)">التالي ✨</button>
    </div>
  </div>

  <!-- الصفحة الثالثة (الفيديو) -->
  <div class="story-section" id="sec-3" style="display:none;">
    <div class="container">
      <div class="video-box">
        <video id="my-video" class="story-video" controls playsinline>
          <source src="3.mp4" type="video/mp4">
          متصفحك لا يدعم الفيديو
        </video>
        <div class="exact-custom-text">من السنة اللي فاتت للنهارده 
كل لحظة معاك كانت من اجمل ايام حياتي 
ربنا يخليك ليا ياحبيبي ونفضل العمر كله سوا ...</div>
      </div>
      <button class="next-btn" onclick="goToSec(4)">التالي لأخر صفحة ❤️</button>
    </div>
  </div>

  <!-- الصفحة الرابعة والأخيرة -->
  <div class="story-section" id="sec-4" style="display:none;">
    <div class="container">
      <img id="img-4" class="story-img" alt="4">
      <button class="celebrate-btn" onclick="launchFireworks()">إعادة الألعاب النارية والصواريخ 🎆</button>
    </div>
  </div>

  <script>
    let hasCelebrated = false;

    document.addEventListener('click', function() {
      const music = document.getElementById('bg-music');
      if(music.paused) {
        music.play().catch(e => {});
      }
    }, { once: true });

    function goToSec(num) {
      document.querySelectorAll('.story-section').forEach(s => s.style.display = 'none');
      document.getElementById('sec-' + num).style.display = 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // لو راحت الصفحة الرابعة سواء بالضغط أو بالسكرول
      if (num === 4 && !hasCelebrated) {
        hasCelebrated = true;
        setTimeout(launchFireworks, 300);
      }
    }

    // مراقبة لو المستخدم اتنقل للـ Sec-4 عن طريق السكرول اليدوي العادي
    window.addEventListener('scroll', function() {
      const sec4 = document.getElementById('sec-4');
      if (sec4 && sec4.style.display !== 'none') {
        const rect = sec4.getBoundingClientRect();
        // لو الصفحة الأخيرة ظهرت على الشاشة
        if (rect.top <= window.innerHeight / 2 && !hasCelebrated) {
          hasCelebrated = true;
          launchFireworks();
        }
      }
    });

    function launchFireworks() {
      var duration = 3.5 * 1000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 35, spread: 360, ticks: 80, zIndex: 10000 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        var particleCount = 40 * (timeLeft / duration);
        
        confetti(Object.assign({}, defaults, { 
          particleCount, 
          origin: { x: randomInRange(0.1, 0.4), y: Math.random() - 0.2 },
          colors: ['#7A1C29', '#FFD700', '#FFFFFF', '#5A121D']
        }));
        confetti(Object.assign({}, defaults, { 
          particleCount, 
          origin: { x: randomInRange(0.6, 0.9), y: Math.random() - 0.2 },
          colors: ['#7A1C29', '#FFD700', '#FFFFFF', '#FFC0CB']
        }));
      }, 250);

      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = Math.random() * window.innerWidth + 'px';
          star.style.background = Math.random() > 0.4 ? '#FFD700' : '#7A1C29';
          star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
          document.body.appendChild(star);
          setTimeout(() => star.remove(), 4000);
        }, i * 60);
      }
    }

    window.onload = function() {
      loadSmartImage('img-1', ['Photo1', 'photo1', 'Photo 1', 'photo 1', '1']);
      loadSmartImage('img-2', ['Photo2', 'photo2', 'Photo 2', 'photo 2', '2']);
      loadSmartImage('img-4', ['Photo4', 'photo4', 'Photo 4', 'photo 4', '4']);
    };

    function loadSmartImage(imgId, namesList) {
      const imgElem = document.getElementById(imgId);
      if(!imgElem) return;
      const exts = ['jpg', 'JPG', 'png', 'PNG', 'jpeg', 'JPEG'];
      let nIdx = 0;
      function tryNextName() {
        if (nIdx >= namesList.length) return;
        let base = namesList[nIdx];
        let eIdx = 0;
        function tryNextExt() {
          if (eIdx >= exts.length) { nIdx++; tryNextName(); return; }
          let src = base + '.' + exts[eIdx++];
          let testImg = new Image();
          testImg.onload = () => imgElem.src = src;
          testImg.onerror = () => tryNextExt();
          testImg.src = src;
        }
        tryNextExt();
      }
      tryNextName();
    }
  </script>
</body>
</html>
