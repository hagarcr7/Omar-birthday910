<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 3amory 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Amiri:ital,wght@1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #F7F3ED;
      --card-bg: #FFFFFF;
      --burgundy: #7A1C29;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-sparkle {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(circle, #7A1C29 2px, transparent 2px),
        radial-gradient(circle, #FFD700 2px, transparent 2px);
      background-size: 60px 60px;
      opacity: 0.2;
    }

    /* مسافات معقولة ومش مبالغ فيها بين الصور */
    .story-section {
      width: 100%;
      max-width: 400px;
      min-height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 40px;
      z-index: 2;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 20px 16px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(122, 28, 41, 0.1);
      text-align: center;
      border: 1.5px solid #EAE3D9;
      position: relative;
    }

    .birthday-title-top {
      color: var(--burgundy);
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      font-family: 'Pacifico', cursive, sans-serif;
      letter-spacing: 1px;
    }

    .story-img {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 16px;
      background-color: #FAF8F5;
      margin-bottom: 10px;
    }

    .calendar-box {
      margin-top: 10px;
      background: #FAF8F5;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #EAE3D9;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.6s ease;
    }

    .calendar-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .calendar-header {
      color: var(--burgundy);
      font-size: 1.15rem;
      font-weight: bold;
      font-family: 'Pacifico', cursive, sans-serif;
      margin-bottom: 6px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      font-size: 0.8rem;
    }

    .calendar-grid span {
      padding: 3px;
      text-align: center;
      position: relative;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.25s ease;
    }

    .calendar-grid span.show-day {
      opacity: 1;
      transform: scale(1);
    }

    .calendar-grid .day-name {
      color: #888;
      font-weight: bold;
      opacity: 1 !important;
      transform: none !important;
    }

    .calendar-grid .heart-day {
      background-color: #F9ECEE;
      color: var(--burgundy);
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .calendar-grid .heart-day::after {
      content: '❤️';
      position: absolute;
      font-size: 0.5rem;
      top: -2px;
      right: 0;
    }

    .typing-text {
      margin-top: 12px;
      color: var(--burgundy);
      font-size: 1.2rem;
      font-weight: bold;
      font-family: 'Amiri', serif;
      border-left: 2px solid var(--burgundy);
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      margin-right: auto;
      margin-left: auto;
    }

    @keyframes typingEffect {
      from { width: 0; }
      to { width: 100%; }
    }

    .start-typing {
      animation: typingEffect 2s steps(30, end) forwards;
    }

    .floating-arrow-guide {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 25px;
      font-size: 1.5rem;
      color: #FFFFFF;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--burgundy), #5A121D);
      box-shadow: 0 0 15px rgba(122, 28, 41, 0.7);
      border: 2px solid #F9ECEE;
      cursor: pointer;
      z-index: 1000;
      animation: floatButterfly 2s infinite ease-in-out;
      transition: opacity 0.3s ease;
    }

    @keyframes floatButterfly {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    .star {
      position: absolute;
      width: 14px;
      height: 14px;
      background: gold;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: fall linear forwards;
      z-index: 999;
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(500px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-sparkle"></div>
  <audio id="bg-music" src="MUSIC.mp3" preload="auto" loop></audio>

  <div id="flying-arrow" class="floating-arrow-guide" onclick="scrollToNext()">⬇</div>

  <!-- القسم الأول -->
  <div class="story-section" id="section-1">
    <div class="container">
      <div class="birthday-title-top">HAPPY BIRTHDAY</div>
      <img id="img-1" alt="Photo 1" class="story-img">
    </div>
  </div>

  <!-- القسم الثاني (ديير عموري وتصميمك الأصلي للتقويم تحتها مباشرة) -->
  <div class="story-section" id="section-2" data-animated="false">
    <div class="container">
      <div id="typed-title" class="birthday-title-top" style="width: 0; overflow: hidden; white-space: nowrap; margin: 0 auto 12px auto;">Dear 3amory</div>
      
      <img id="img-2" alt="Photo 2" class="story-img">

      <div class="calendar-box" id="cal-box">
        <div class="calendar-header">October 2026</div>
        <div class="calendar-grid" id="cal-grid">
          <!-- ترتيب الأيام مطابق لتصميمك (السبت لـ الأحد) -->
          <span class="day-name">Sat</span><span class="day-name">Fri</span><span class="day-name">Thu</span><span class="day-name">Wed</span><span class="day-name">Tue</span><span class="day-name">Mon</span><span class="day-name">Sun</span>
          <span class="date-num">3</span><span class="date-num">2</span><span class="date-num">1</span><span class="date-num"></span><span class="date-num"></span><span class="date-num"></span><span class="date-num"></span>
          <span class="date-num">10</span><span class="date-num heart-day">9</span><span class="date-num">8</span><span class="date-num">7</span><span class="date-num">6</span><span class="date-num">5</span><span class="date-num">4</span>
          <span class="date-num">17</span><span class="date-num">16</span><span class="date-num">15</span><span class="date-num">14</span><span class="date-num">13</span><span class="date-num">12</span><span class="date-num">11</span>
          <span class="date-num">24</span><span class="date-num">23</span><span class="date-num">22</span><span class="date-num">21</span><span class="date-num">20</span><span class="date-num">19</span><span class="date-num">18</span>
          <span class="date-num">31</span><span class="date-num">30</span><span class="date-num">29</span><span class="date-num">28</span><span class="date-num">27</span><span class="date-num">26</span><span class="date-num">25</span>
        </div>
      </div>

      <div id="typed-footer" class="typing-text">كل سنة وانت حبيبي ...</div>
    </div>
  </div>

  <!-- القسم الثالث -->
  <div class="story-section" id="section-3">
    <div class="container">
      <img id="img-3" alt="Photo 3" class="story-img">
    </div>
  </div>

  <!-- القسم الرابع والأخير -->
  <div class="story-section" id="section-4">
    <div class="container">
      <img id="img-4" alt="Photo 4" class="story-img">
      <div style="margin-top:10px; color:var(--burgundy); font-size:1.2rem; font-weight:bold; font-family:'Amiri',serif;">Happy Birthday My Love! ❤️</div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSections = 4;

    window.onload = function() {
      const music = document.getElementById('bg-music');
      function playMusicOnce() {
        music.play().catch(e => console.log("Audio waiting"));
        document.removeEventListener('click', playMusicOnce);
        document.removeEventListener('touchstart', playMusicOnce);
      }
      document.addEventListener('click', playMusicOnce);
      document.addEventListener('touchstart', playMusicOnce);

      loadSmartImage('img-1', ['Photo1', 'photo1', 'Photo 1', 'photo 1', '1']);
      loadSmartImage('img-2', ['Photo2', 'photo2', 'Photo 2', 'photo 2', '2']);
      loadSmartImage('img-3', ['Photo3', 'photo3', 'Photo 3', 'photo 3', '3']);
      loadSmartImage('img-4', ['Photo4', 'photo4', 'Photo 4', 'photo 4', '4']);

      setupScrollObserver();
    };

    function scrollToNext() {
      const music = document.getElementById('bg-music');
      if (music.paused) {
        music.play().catch(e => {});
      }

      currentStep++;
      if (currentStep > totalSections) {
        currentStep = totalSections;
        return;
      }

      const target = document.getElementById('section-' + currentStep);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      if (currentStep === totalSections) {
        setTimeout(() => {
          const arrow = document.getElementById('flying-arrow');
          arrow.style.opacity = '0';
          arrow.style.pointerEvents = 'none';
          triggerFinalCelebration();
        }, 500);
      }
    }

    function setupScrollObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.target.id === 'section-2') {
            const isAnimated = entry.target.getAttribute('data-animated');
            if (isAnimated === 'false') {
              entry.target.setAttribute('data-animated', 'true');
              startSection2Animations();
            }
          }
        });
      }, { threshold: 0.5 });

      observer.observe(document.getElementById('section-2'));
    }

    function startSection2Animations() {
      const titleElem = document.getElementById('typed-title');
      titleElem.style.animation = "typingEffect 1s steps(15, end) forwards";

      setTimeout(() => {
        const calBox = document.getElementById('cal-box');
        calBox.classList.add('visible');

        const dateNums = document.querySelectorAll('.date-num');
        dateNums.forEach((num, index) => {
          setTimeout(() => {
            num.classList.add('show-day');
          }, index * 30);
        });
      }, 1000);

      setTimeout(() => {
        const footerElem = document.getElementById('typed-footer');
        footerElem.classList.add('start-typing');
      }, 2500);
    }

    function triggerFinalCelebration() {
      createFallingStars();
      confetti({
        particleCount: 200,
        spread: 160,
        origin: { y: 0.6 },
        colors: ['#7A1C29', '#FFD700', '#FFFFFF', '#FF69B4', '#FF4500']
      });
    }

    function createFallingStars() {
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = Math.random() * window.innerWidth + 'px';
          star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
          document.body.appendChild(star);
          setTimeout(() => star.remove(), 4000);
        }, i * 80);
      }
    }

    function loadSmartImage(imgId, namesList) {
      const imgElem = document.getElementById(imgId);
      const exts = ['jpg', 'JPG', 'png', 'PNG', 'jpeg', 'JPEG'];
      let nIdx = 0;
      function tryNextName() {
        if (nIdx >= namesList.length) return;
        let base = namesList[nIdx];
        let eIdx = 0;
        function tryNextExt() {
          if (eIdx >= exts.length) { nIdx++; tryNextName(); return; }
          let src = base + '.' + exts[eIdx++];
          let testImg = new Image();
          testImg.onload = () => imgElem.src = src;
          testImg.onerror = () => tryNextExt();
          testImg.src = src;
        }
        tryNextExt();
      }
      tryNextName();
    }
  </script>
</body>
</html>
