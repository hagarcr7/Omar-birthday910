<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 3amory - Photos 🎉</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #F7F3ED;
      --card-bg: #FFFFFF;
      --burgundy: #7A1C29;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
      overflow-x: hidden;
      overflow-y: auto; 
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 25px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(122, 28, 41, 0.08);
      text-align: center;
      border: 1.5px solid #EAE3D9;
      position: relative;
      margin-bottom: 50px;
    }

    h2 {
      color: var(--burgundy);
      margin-bottom: 15px;
      font-weight: 700;
      line-height: 1.4;
    }

    .story-step {
      display: none;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px dashed #EAE3D9;
    }

    .story-step.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .story-img {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 14px;
      background-color: #FAF8F5;
      border: 2px solid var(--burgundy);
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(122, 28, 41, 0.12);
    }

    /* سهم نبيتي منور وبتوهج حركي جذاب */
    .glowing-arrow {
      font-size: 2.2rem;
      color: #FFFFFF;
      margin: 15px auto;
      animation: bounceAndGlow 1.8s infinite ease-in-out;
      cursor: pointer;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--burgundy), #5A121D);
      box-shadow: 0 0 15px rgba(122, 28, 41, 0.6), 0 4px 10px rgba(0,0,0,0.15);
      border: 2px solid #F9ECEE;
      transition: transform 0.2s;
    }

    .glowing-arrow:hover {
      transform: scale(1.1);
    }

    @keyframes bounceAndGlow {
      0%, 100% { 
        transform: translateY(0); 
        box-shadow: 0 0 10px rgba(122, 28, 41, 0.5);
      }
      50% { 
        transform: translateY(10px); 
        box-shadow: 0 0 25px rgba(122, 28, 41, 0.9);
      }
    }

    .star {
      position: absolute;
      width: 15px;
      height: 15px;
      background: gold;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: fall linear forwards;
      z-index: 999;
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(500px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="MUSIC.mp3" preload="auto" loop></audio>

  <div class="container">
    <h2 style="font-size: 1.4rem; margin-bottom: 10px;">رحلة ذكرياتنا ❤️</h2>
    <p style="font-size: 0.95rem; color: #666; margin-bottom: 20px;">انزل مع السهم عشان تشوف المفاجأة بالترتيب 👇🏻</p>

    <!-- الصورة الأولى (تظهر فوراً عند فتح الصفحة) -->
    <div class="story-step active" id="step-1">
      <img id="img-1" alt="Photo 1" class="story-img">
      <p style="font-size: 0.95rem; font-weight: 600; color: var(--burgundy); margin-bottom: 5px;">انزل عشان تشوف اللي بعده ✨</p>
      <div class="glowing-arrow" onclick="nextStep(2)">⬇</div>
    </div>

    <!-- الصورة الثانية -->
    <div class="story-step" id="step-2">
      <img id="img-2" alt="Photo 2" class="story-img">
      <p style="font-size: 0.95rem; font-weight: 600; color: var(--burgundy); margin-bottom: 5px;">كمل نزول يا عُمري 👇🏻</p>
      <div class="glowing-arrow" onclick="nextStep(3)">⬇</div>
    </div>

    <!-- الصورة الثالثة -->
    <div class="story-step" id="step-3">
      <img id="img-3" alt="Photo 3" class="story-img">
      <p style="font-size: 0.95rem; font-weight: 600; color: var(--burgundy); margin-bottom: 5px;">قربنا نخلص، انزل كمان مرة ❤️</p>
      <div class="glowing-arrow" onclick="nextStep(4)">⬇</div>
    </div>

    <!-- الصورة الرابعة والأخيرة -->
    <div class="story-step" id="step-4">
      <img id="img-4" alt="Photo 4" class="story-img">
      <h2 style="font-size: 1.3rem; margin-top: 10px;">كل سنة وانت طيب يا احلى عمورة في الدنيا! 🎂❤️</h2>
    </div>

  </div>

  <script>
    // دالة ذكية جداً لالتقاط الصور بجميع امتداداتها الممكنة
    function loadSmartImage(imgId, namesList) {
      const imgElem = document.getElementById(imgId);
      const exts = ['jpg', 'JPG', 'png', 'PNG', 'jpeg', 'JPEG'];
      let nIdx = 0;

      function tryNextName() {
        if (nIdx >= namesList.length) return;
        let base = namesList[nIdx];
        let eIdx = 0;

        function tryNextExt() {
          if (eIdx >= exts.length) {
            nIdx++;
            tryNextName();
            return;
          }
          let src = base + '.' + exts[eIdx++];
          let testImg = new Image();
          testImg.onload = function() {
            imgElem.src = src;
          };
          testImg.onerror = function() {
            tryNextExt();
          };
          testImg.src = src;
        }
        tryNextExt();
      }
      tryNextName();
    }

    window.onload = function() {
      const music = document.getElementById('bg-music');
      music.play().catch(e => console.log("Audio play blocked:", e));

      loadSmartImage('img-1', ['Photo 1', 'Photo1', 'photo 1', 'photo1', '1']);
      loadSmartImage('img-2', ['Photo 2', 'Photo2', 'photo 2', 'photo2', '2']);
      loadSmartImage('img-3', ['Photo 3', 'Photo3', 'photo 3', 'photo3', '3']);
      loadSmartImage('img-4', ['Photo 4', 'Photo4', 'photo 4', 'photo4', '4']);
    };

    function nextStep(stepNum) {
      const targetStep = document.getElementById('step-' + stepNum);
      if (targetStep) {
        targetStep.classList.add('active');
        targetStep.scrollIntoView({ behavior: 'smooth', block: 'start' });

        if (stepNum === 4) {
          createFallingStars();
          confetti({
            particleCount: 100,
            spread: 120,
            origin: { y: 0.4 },
            colors: ['#7A1C29', '#FFD700', '#FFFFFF']
          });
        }
      }
    }

    function createFallingStars() {
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = Math.random() * window.innerWidth + 'px';
          star.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(star);
          
          setTimeout(() => {
            star.remove();
          }, 4000);
        }, i * 150);
      }
    }
  </script>
</body>
</html>
