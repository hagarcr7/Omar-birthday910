<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 3amory</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #F7F3ED;
      --card-bg: #FFFFFF;
      --burgundy: #7A1C29;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    .story-section {
      width: 100%;
      max-width: 400px;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 30px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 10px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(122, 28, 41, 0.08);
      text-align: center;
      border: 1.5px solid #EAE3D9;
      position: relative;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .story-img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 14px;
      background-color: #FAF8F5;
      display: block;
    }

    .interactive-box {
      background: linear-gradient(135deg, #7A1C29 0%, #5A121D 100%);
      width: 100%;
      max-width: 260px;
      height: 180px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(122, 28, 41, 0.3);
      position: relative;
      border: 2px solid #FFD700;
      animation: subtleShake 2s infinite ease-in-out;
    }

    @keyframes subtleShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-2deg) scale(1.02); }
      40% { transform: rotate(2deg) scale(1.02); }
      60% { transform: rotate(-1deg) scale(1); }
      80% { transform: rotate(1deg) scale(1); }
    }

    .interactive-icon {
      font-size: 3.5rem;
      color: #FFD700;
    }

    /* تكبير إطار الفيديو ليملى الشاشة وبشكل أنيق جداً */
    .video-frame-container {
      display: none;
      width: 100%;
      max-width: 380px;
      background: #111;
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(122, 28, 41, 0.2);
      border: 3px solid var(--burgundy);
      margin: 5px auto;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .video-frame {
      width: 100%;
      height: 380px; /* زيادة الطول عشان يبان ضخم ومريح */
      border-radius: 14px;
      border: none;
      background: #000;
      pointer-events: none; /* يمنع اللمس المباشر اللي بيظهر أزرار جوجل درايف */
    }

    .hidden-content {
      display: none;
      width: 100%;
      animation: fadeIn 0.5s ease;
    }

    .arrow-btn {
      margin-top: 12px;
      font-size: 1.4rem;
      color: #FFFFFF;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--burgundy);
      box-shadow: 0 4px 10px rgba(122, 28, 41, 0.4);
      cursor: pointer;
      border: none;
      animation: bounceArrow 1.5s infinite ease-in-out;
    }

    @keyframes bounceArrow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    .star {
      position: fixed;
      width: 16px;
      height: 16px;
      background: #FFD700;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: fall linear forwards;
      z-index: 9999;
    }

    @keyframes fall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="MUSIC.mp3" preload="auto" loop></audio>

  <!-- الصفحة الأولى: صورة 1 -->
  <div class="story-section" id="sec-1">
    <div class="container">
      <img id="img-1" class="story-img" alt="1">
    </div>
    <button class="arrow-btn" onclick="scrollToSec('sec-2')">⬇</button>
  </div>

  <!-- الصفحة الثانية: باب مقفول يفتح الصورة 2 -->
  <div class="story-section" id="sec-2">
    <div class="container">
      <div id="box-2" class="interactive-box" onclick="revealContent(2)">
        <div class="interactive-icon">🚪</div>
      </div>
      <div id="content-2" class="hidden-content">
        <img id="img-2" class="story-img" alt="2">
      </div>
    </div>
    <button class="arrow-btn" onclick="scrollToSec('sec-3')">⬇</button>
  </div>

  <!-- الصفحة الثالثة: ظرف الفيديو الكبير النظيف بدون أزرار وقت -->
  <div class="story-section" id="sec-3">
    <div class="container">
      <div id="box-3" class="interactive-box" onclick="revealVideo()">
        <div class="interactive-icon">💌</div>
      </div>
      <div id="videoContainer" class="video-frame-container">
        <!-- تم إضافة parameters لمنع ظهور أزرار التحسس ووقت جوجل درايف قدر الإمكان -->
        <iframe id="myVideo" class="video-frame" src="" data-src="https://drive.google.com/file/d/1p-qaLueEzfL7p_ibP8Cnzu3neTtlhLCS/preview?autoplay=1&controls=0&disablekb=1" allow="autoplay"></iframe>
      </div>
    </div>
    <button class="arrow-btn" onclick="scrollToSec('sec-4')">⬇</button>
  </div>

  <!-- الصفحة الرابعة: قفل بمفتاح يفتح الصورة 3 -->
  <div class="story-section" id="sec-4">
    <div class="container">
      <div id="box-4" class="interactive-box" onclick="revealContent(4)">
        <div class="interactive-icon">🔐</div>
      </div>
      <div id="content-4" class="hidden-content">
        <img id="img-3" class="story-img" alt="3">
      </div>
    </div>
    <button class="arrow-btn" onclick="scrollToSec('sec-5')">⬇</button>
  </div>

  <!-- الصفحة الخامسة: ورقة كتاب مقفولة تفتح الصورة 4 مع الاحتفال -->
  <div class="story-section" id="sec-5">
    <div class="container">
      <div id="box-5" class="interactive-box" onclick="revealContent(5)">
        <div class="interactive-icon">📖</div>
      </div>
      <div id="content-5" class="hidden-content">
        <img id="img-4" class="story-img" alt="4">
      </div>
    </div>
  </div>

  <script>
    let hasCelebrated = false;

    document.addEventListener('click', function() {
      const music = document.getElementById('bg-music');
      if(music.paused) {
        music.play().catch(e => {});
      }
    }, { once: true });

    function revealContent(num) {
      document.getElementById('box-' + num).style.display = 'none';
      document.getElementById('content-' + num).style.display = 'block';
    }

    function revealVideo() {
      const box = document.getElementById('box-3');
      const videoContainer = document.getElementById('videoContainer');
      const video = document.getElementById('myVideo');
      const music = document.getElementById('bg-music');

      if(music) {
        music.volume = 0.15;
      }

      box.style.display = 'none';
      videoContainer.style.display = 'block';
      video.src = video.getAttribute('data-src');
    }

    function scrollToSec(secId) {
      document.getElementById(secId).scrollIntoView({ behavior: 'smooth' });
    }

    window.addEventListener('scroll', function() {
      const sec5 = document.getElementById('sec-5');
      if (sec5 && !hasCelebrated) {
        const rect = sec5.getBoundingClientRect();
        if (rect.top <= window.innerHeight / 1.5) {
          hasCelebrated = true;
          launchFireworks();
        }
      }
    });

    function launchFireworks() {
      var duration = 3.5 * 1000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 35, spread: 360, ticks: 80, zIndex: 10000 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        var particleCount = 40 * (timeLeft / duration);
        
        confetti(Object.assign({}, defaults, { 
          particleCount, 
          origin: { x: randomInRange(0.1, 0.4), y: Math.random() - 0.2 },
          colors: ['#7A1C29', '#FFD700', '#FFFFFF', '#5A121D']
        }));
        confetti(Object.assign({}, defaults, { 
          particleCount, 
          origin: { x: randomInRange(0.6, 0.9), y: Math.random() - 0.2 },
          colors: ['#7A1C29', '#FFD700', '#FFFFFF', '#FFC0CB']
        }));
      }, 250);

      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = Math.random() * window.innerWidth + 'px';
          star.style.background = Math.random() > 0.4 ? '#FFD700' : '#7A1C29';
          star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
          document.body.appendChild(star);
          setTimeout(() => star.remove(), 4000);
        }, i * 60);
      }
    }

    window.onload = function() {
      loadSmartImage('img-1', ['Photo1', 'photo1', 'Photo 1', 'photo 1', '1']);
      loadSmartImage('img-2', ['Photo2', 'photo2', 'Photo 2', 'photo 2', '2']);
      loadSmartImage('img-3', ['Photo3', 'photo3', 'Photo 3', 'photo 3', '3']);
      loadSmartImage('img-4', ['Photo4', 'photo4', 'Photo 4', 'photo 4', '4']);
    };

    function loadSmartImage(imgId, namesList) {
      const imgElem = document.getElementById(imgId);
      if(!imgElem) return;
      const exts = ['jpg', 'JPG', 'png', 'PNG', 'jpeg', 'JPEG'];
      let nIdx = 0;
      function tryNextName() {
        if (nIdx >= namesList.length) return;
        let base = namesList[nIdx];
        let eIdx = 0;
        function tryNextExt() {
          if (eIdx >= exts.length) { nIdx++; tryNextName(); return; }
          let src = base + '.' + exts[eIdx++];
          let testImg = new Image();
          testImg.onload = () => imgElem.src = src;
          testImg.onerror = () => tryNextExt();
          testImg.src = src;
        }
        tryNextExt();
      }
      tryNextName();
    }
  </script>
</body>
</html>
